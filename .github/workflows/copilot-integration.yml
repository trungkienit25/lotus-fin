name: Copilot integration gates
on:
  pull_request:
  push:
    branches: [main, staging, develop, 'codex/**']
jobs:
  offline-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.22.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install 'pydantic==2.12.5' 'pytest>=8,<9' 'werkzeug>=3.1.6,<4' pandas numpy
      - run: python -m pytest -p no:cacheprovider -q lotus_fin/lotus_fin/tests/test_copilot_full_integration.py lotus_fin/lotus_fin/tests/test_l4_mutation_security.py lotus_fin/lotus_fin/tests/test_l5_action_workflows.py lotus_fin/lotus_fin/tests/test_overdue_evaluator.py lotus_fin/lotus_fin/tests/test_search_overdue_invoices.py
        env: {PYTHONPATH: '${{ github.workspace }}/lotus_fin'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: node --experimental-strip-types --test frontend/tests/*.test.ts frontend/tests/p2b/*.test.ts
      - run: npm run build -- --base=/assets/lotus_fin/core/
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: git diff --check
