map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    absolute_redirect off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Frontend React/Vite SPA assets (serve local vite assets first, fallback to Frappe)
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri @frappe_backend;
    }

    # 2. Block direct access to Frappe Desk and redirect to Lotus Fin Frontend
    location ~ ^/desk($|/) {
        return 301 /;
    }

    # 3. Frappe Backend APIs, copilot session, socket.io, and static uploaded files
    location ~ ^/(api|files|socket\.io|copilot/session)($|/) {
        try_files $uri @frappe_backend;
    }

    # 4. Frontend React/Vite SPA routes (including /login, /app, /copilot, /ai, /home, /workspace, /report, /page)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location @frappe_backend {
        proxy_pass http://frappe-frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}

