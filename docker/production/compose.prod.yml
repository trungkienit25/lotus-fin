name: lotus-fin-prod

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy & Frontend Gateway (Port 80)
  # ----------------------------------------------------------------------------
  web:
    image: lotus-fin/gateway:latest
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-80}:80"
    depends_on:
      frappe-frontend:
        condition: service_started
    networks:
      - lotus_prod_net

  # ----------------------------------------------------------------------------
  # 2. Frappe Nginx / Reverse Proxy internal service
  # ----------------------------------------------------------------------------
  frappe-frontend:
    image: frappe/erpnext:v16.36.1
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${LOTUS_SITE:-frontend}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - lotus_prod_net
    depends_on:
      - backend
      - websocket

  # ----------------------------------------------------------------------------
  # 3. Frappe Backend Worker & API Server
  # ----------------------------------------------------------------------------
  backend:
    image: frappe/erpnext:v16.36.1
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../../lotus_fin:/home/frappe/frappe-bench/apps/lotus_fin
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/lotus_fin
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      LOTUS_AI_PROVIDER: ${LOTUS_AI_PROVIDER:-gemini}
      LOTUS_LLM_PROVIDER: ${LOTUS_LLM_PROVIDER:-gemini}
      LOTUS_LLM_MODEL: ${LOTUS_LLM_MODEL:-gemini-flash-lite-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOTUS_SMTP_SERVER: ${LOTUS_SMTP_SERVER:-smtp.gmail.com}
      LOTUS_SMTP_PORT: ${LOTUS_SMTP_PORT:-587}
      LOTUS_SMTP_EMAIL: ${LOTUS_SMTP_EMAIL:-lotusfin.notifications@gmail.com}
      LOTUS_SMTP_PASSWORD: ${LOTUS_SMTP_PASSWORD:-btcyjmbjnykrrpol}
      LOTUS_SMTP_USE_TLS: ${LOTUS_SMTP_USE_TLS:-1}
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - lotus_prod_net

  configurator:
    image: frappe/erpnext:v16.36.1
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - lotus_prod_net

  create-site:
    image: frappe/erpnext:v16.36.1
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=${ADMIN_PASSWORD:-admin} --db-root-username=root --db-root-password=${DB_PASSWORD:-admin} --install-app erpnext --set-default frontend;
        fi;
    networks:
      - lotus_prod_net

  # ----------------------------------------------------------------------------
  # 4. Storage & Cache Services
  # ----------------------------------------------------------------------------
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - lotus_prod_net

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    networks:
      - lotus_prod_net

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    networks:
      - lotus_prod_net

  queue-long:
    image: frappe/erpnext:v16.36.1
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../../lotus_fin:/home/frappe/frappe-bench/apps/lotus_fin
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/lotus_fin
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
      LOTUS_AI_PROVIDER: ${LOTUS_AI_PROVIDER:-gemini}
      LOTUS_LLM_PROVIDER: ${LOTUS_LLM_PROVIDER:-gemini}
      LOTUS_LLM_MODEL: ${LOTUS_LLM_MODEL:-gemini-flash-lite-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - lotus_prod_net

  queue-short:
    image: frappe/erpnext:v16.36.1
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../../lotus_fin:/home/frappe/frappe-bench/apps/lotus_fin
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/lotus_fin
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
      LOTUS_AI_PROVIDER: ${LOTUS_AI_PROVIDER:-gemini}
      LOTUS_LLM_PROVIDER: ${LOTUS_LLM_PROVIDER:-gemini}
      LOTUS_LLM_MODEL: ${LOTUS_LLM_MODEL:-gemini-flash-lite-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - lotus_prod_net

  scheduler:
    image: frappe/erpnext:v16.36.1
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../../lotus_fin:/home/frappe/frappe-bench/apps/lotus_fin
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/lotus_fin
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - lotus_prod_net

  websocket:
    image: frappe/erpnext:v16.36.1
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - lotus_prod_net

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  lotus_prod_net:
    driver: bridge

