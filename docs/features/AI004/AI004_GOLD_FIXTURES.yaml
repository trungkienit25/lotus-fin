# AI004 What-if Scenario Gold Fixtures
# Canonical test vectors for deterministic simulation verification

baseline:
  company: "Lotus-fin"
  as_of: "2026-01-01"
  horizon_days: 30
  opening_cash: "100000000.00"
  events:
    - id: "EV-001"
      type: "AR_INVOICE"
      date: "2026-01-05"
      direction: "INFLOW"
      amount: "50000000.00"
      description: "Sales Invoice Customer A"
    - id: "EV-002"
      type: "AR_INVOICE"
      date: "2026-01-15"
      direction: "INFLOW"
      amount: "80000000.00"
      description: "Sales Invoice Customer B"
    - id: "EV-003"
      type: "AP_INVOICE"
      direction: "OUTFLOW"
      date: "2026-01-10"
      amount: "70000000.00"
      description: "Purchase Invoice Supplier X"
    - id: "EV-004"
      type: "AP_INVOICE"
      direction: "OUTFLOW"
      date: "2026-01-20"
      amount: "110000000.00"
      description: "Purchase Invoice Supplier Y"

scenarios:
  # 1. Sales Drop 20%
  - name: "scenario_sales_drop_20"
    params:
      sales_change_pct: "-0.20"
      collection_delay_days: 0
      supplier_due_shift_days: 0
    expected:
      simulated_closing_cash: "24000000.00" # 100M + 40M + 64M - 70M - 110M = 24M
      closing_cash_delta: "-26000000.00"    # Baseline was 100M + 130M - 180M = 50M
      has_shortfall: false
      minimum_cash: "24000000.00"

  # 2. Collection Delay 10 Days
  - name: "scenario_collection_delay_10"
    params:
      sales_change_pct: "0.00"
      collection_delay_days: 10
      supplier_due_shift_days: 0
    expected:
      # EV-001 moves to 2026-01-15 (50M)
      # EV-002 moves to 2026-01-25 (80M)
      # On 2026-01-10, cash was 100M - 70M = 30M (EV-001 not collected yet!)
      # On 2026-01-20, cash is 30M + 50M - 110M = -30M (DEFICIT!)
      has_shortfall: true
      first_shortfall_date: "2026-01-20"
      minimum_cash: "-30000000.00"

  # 3. Combined Shock (Sales Drop 10%, Delay 5 days, Expense Shock 30M)
  - name: "scenario_combined_shock"
    params:
      sales_change_pct: "-0.10"
      collection_delay_days: 5
      supplier_due_shift_days: 0
      one_off_expense: "30000000.00"
      one_off_expense_date: "2026-01-08"
    expected:
      has_shortfall: false
      minimum_cash: "7000000.00"
      simulated_closing_cash: "7000000.00" # 100M + 45M + 72M - 70M - 110M - 30M = 7M
      closing_cash_delta: "-43000000.00"
